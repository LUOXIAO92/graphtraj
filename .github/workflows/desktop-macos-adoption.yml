name: desktop-macos-adoption

# The desktop run installs a macOS artifact and starts the GUI, so it costs time
# and runs when a macOS result must be re-proven. A first run cannot use
# workflow_dispatch: GitHub only offers that trigger once the file is on the
# default branch. This ticket branch therefore triggers by push, and
# workflow_dispatch stays available for later re-runs.
on:
  push:
    branches: [agent/265-desktop-mac-adoption, agent/285-desktop-d-monitor-projects, agent/286-desktop-usage-history-range, agent/287-desktop-agents-models-teams, agent/288-desktop-d-integrated-adoption-macos, agent/290-desktop-d-direct-port-macos, agent/292-desktop-readable-runtime-events]
  workflow_dispatch:
    inputs:
      mode:
        description: Adoption scope (usage exercises focused Ticket 293 persistence and Usage UI)
        type: choice
        options: [standard, activity, usage]
        default: standard

permissions:
  contents: read

jobs:
  installed-macos:
    name: Installed macOS artifact and adoption
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      ACTIVITY_ADOPTION: ${{ inputs.mode == 'usage' || inputs.mode == 'activity' || github.ref_name == 'agent/292-desktop-readable-runtime-events' }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      # Pinned toolchains: the evidence names the versions that produced it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # The desktop reads the task graph through the public native tool, so the
      # runner installs the same GraphTraj package this checkout builds.
      - name: Install the native GraphTraj tool
        working-directory: .
        run: python -m pip install --disable-pip-version-check .

      - name: Install desktop dependencies
        run: npm ci --no-audit --no-fund

      - name: Build desktop
        run: npm run build

      - name: Desktop unit checks
        if: env.ACTIVITY_ADOPTION != 'true'
        run: |
          if [ "${{ github.ref_name }}" = "agent/287-desktop-agents-models-teams" ]; then
            node --test tests/settings*.test.cjs
          else
            node --test tests/*.test.cjs
          fi

      # Controlled accounting/storage checks, not evidence of genuine Main adoption.
      - name: Focused incremental usage and persistence checks
        if: inputs.mode == 'usage'
        run: |
          mkdir -p dist-package/adoption-evidence/usage
          node --preserve-symlinks --preserve-symlinks-main --test tests/activity.test.cjs tests/project-index.test.cjs tests/usage.test.cjs tests/usage-history.test.cjs tests/usage-view.test.cjs 2>&1 | tee dist-package/adoption-evidence/usage/focused-checks.log
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync('dist-package/adoption-evidence/usage/scope.json', JSON.stringify({
            source: process.env.GITHUB_SHA,
            scope: 'Controlled usage persistence and installed Usage UI; not live Main adoption',
            pending: ['Genuine Main source adoption'],
          }, null, 2) + '\n');
          JS

      - name: D renderer navigation and long-output checks
        if: env.ACTIVITY_ADOPTION != 'true' && github.ref_name == 'agent/290-desktop-d-direct-port-macos'
        run: |
          npx playwright install chromium
          node --test tests/monitor-ui.test.mjs

      - name: Package the macOS artifact
        run: npm run package:mac

      - name: Install the artifact under /Applications
        run: |
          rm -rf /Applications/GraphTraj.app
          unzip -q dist-package/GraphTraj-darwin-*.zip -d /Applications
          test -x /Applications/GraphTraj.app/Contents/MacOS/GraphTraj

      - name: Record environment, commands and artifact digest
        run: |
          mkdir -p dist-package/adoption-evidence
          {
            echo "date: $(date -u +%FT%TZ)"
            echo "node: $(node --version)"
            echo "python: $(python --version 2>&1)"
            echo "npm: $(npm --version)"
            sw_vers
            uname -a
            echo "tool: $(which graphtraj-tool)"
            shasum -a 256 dist-package/GraphTraj-darwin-*.zip dist-package/GraphTraj-darwin-*.json
          } 2>&1 | tee dist-package/adoption-evidence/environment.txt

      # Starts the installed bundle and exercises the real picker entry, graph
      # and project switching, node detail, dashboard, settings save/deny/error,
      # persistence, credential non-leakage and GUI-less native operation.
      - name: Set a display large enough for the accepted D reference sizes
        if: env.ACTIVITY_ADOPTION != 'true' && github.ref_name == 'agent/290-desktop-d-direct-port-macos'
        run: |
          brew install displayplacer
          displayplacer list | tee dist-package/adoption-evidence/display-before.txt
          python - <<'PYDISPLAY'
          import re
          import subprocess
          output = subprocess.check_output(['displayplacer', 'list'], text=True)
          display = re.search(r'Persistent screen id: (\S+)', output).group(1)
          modes = [(int(w), int(h)) for w, h in re.findall(r'res:(\d+)x(\d+)', output)]
          usable = sorted(set((w, h) for w, h in modes if w >= 1500 and h >= 1100), key=lambda size: size[0] * size[1])
          if not usable:
              raise SystemExit('No native display mode fits the 1440x1000 reference window; preserve display evidence')
          width, height = usable[0]
          subprocess.run(['displayplacer', f'id:{display} res:{width}x{height}'], check=True)
          PYDISPLAY
          displayplacer list > dist-package/adoption-evidence/display-after.txt

      - name: Installed D views and native changed paths
        if: env.ACTIVITY_ADOPTION != 'true' && github.ref_name == 'agent/290-desktop-d-direct-port-macos'
        env:
          D_ADOPTION_EVIDENCE: dist-package/adoption-evidence/d
        run: node tests/d-adoption.mjs

      - name: Installed app adoption, optionality and security
        if: env.ACTIVITY_ADOPTION != 'true' && github.ref_name != 'agent/290-desktop-d-direct-port-macos'
        env:
          GRAPHTRAJ_APP: /Applications/GraphTraj.app
          GRAPHTRAJ_ADOPTION_SETTINGS_ONLY: ${{ github.ref_name == 'agent/287-desktop-agents-models-teams' && '1' || '0' }}
          GRAPHTRAJ_ADOPTION_USAGE_ONLY: ${{ github.ref_name == 'agent/286-desktop-usage-history-range' && '1' || '0' }}
        run: node --preserve-symlinks --preserve-symlinks-main tests/adoption.mjs

      - name: Integrated candidate dated usage and history
        if: env.ACTIVITY_ADOPTION != 'true' && github.ref_name == 'agent/288-desktop-d-integrated-adoption-macos'
        env:
          GRAPHTRAJ_APP: /Applications/GraphTraj.app
          GRAPHTRAJ_ADOPTION_USAGE_ONLY: '1'
          GRAPHTRAJ_WORK: dist-package/usage-work
          GRAPHTRAJ_EVIDENCE: dist-package/adoption-evidence/usage
        run: node --preserve-symlinks --preserve-symlinks-main tests/adoption.mjs

      - name: Installed focused Usage adoption
        if: inputs.mode == 'usage'
        run: node tests/usage-adoption.mjs

      - name: Installed focused activity adoption
        if: env.ACTIVITY_ADOPTION == 'true' && inputs.mode != 'usage'
        env:
          GRAPHTRAJ_ACTIVITY_EVIDENCE: dist-package/adoption-evidence/activity
        run: node tests/activity-adoption.mjs

      - name: Upload adoption evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphtraj-macos-adoption-evidence
          path: |
            desktop/dist-package/adoption-evidence
            desktop/dist-package/GraphTraj-darwin-*.json
          if-no-files-found: error

      # The runner is recycled after the job, so this upload is the only retained
      # copy of the exact ZIP that was unpacked into /Applications and exercised.
      - name: Upload the installed artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphtraj-macos-app
          path: desktop/dist-package/GraphTraj-darwin-*.zip
          if-no-files-found: error
          retention-days: 7
