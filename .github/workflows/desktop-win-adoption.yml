name: Windows desktop adoption 266
on:
  push:
    branches: [agent/266-desktop-win-adoption, agent/288-desktop-d-integrated-adoption-win, agent/290-desktop-d-direct-port-win, agent/618-desktop-workflows-graftling-ref, agent/622-process-reclaim-windows-noise, agent/619-graftling-windows-import]
permissions:
  contents: read
jobs:
  windows-adoption:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      # graftling tag in GraphTraj's declared range (pyproject.toml).
      GRAFTLING_REF: v0.10.1
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # graftling's src/graftling/PUBLIC_API.md and src/graftling/install are git
      # symlinks that its wheel ships; without core.symlinks Git for Windows
      # writes text stubs. Only this disposable runner's configuration changes.
      - name: Keep graftling's symbolic links on this runner
        run: git config --global core.symlinks true
      # Task 619 only: its branch checks out the unreleased graftling Windows fix at this
      # exact commit (pushed as graftling's agent/619-graftling-windows-import); the app
      # is packaged from this same checkout (GRAFTLING_SOURCE). Other branches: GRAFTLING_REF.
      - name: Check out graftling at the version GraphTraj declares
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: LUOXIAO92/graftling
          ref: ${{ github.ref_name == 'agent/619-graftling-windows-import' && '616671870fb2dd9679ea18fdfdbd2f094b1ae0a9' || env.GRAFTLING_REF }}
          path: graftling
          persist-credentials: false
      - name: Fail unless graftling's linked package documents are real
        run: |
          $api = Get-Item graftling/src/graftling/PUBLIC_API.md
          if ((Get-Content -Raw $api.FullName) -ne (Get-Content -Raw graftling/PUBLIC_API.md)) { throw "graftling/src/graftling/PUBLIC_API.md is not the linked document (LinkType=$($api.LinkType))" }
          if (-not (Test-Path -PathType Container graftling/src/graftling/install)) { throw 'graftling/src/graftling/install is not a directory' }
          if (-not (Get-ChildItem graftling/src/graftling/install -Filter *.md)) { throw 'graftling/src/graftling/install has no install guides' }
          "PUBLIC_API.md LinkType=$($api.LinkType) length=$($api.Length); install: $((Get-ChildItem graftling/src/graftling/install -Filter *.md).Name -join ', ')"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
          architecture: x64
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.7'
          architecture: x64
      - name: Confirm native desktop session
        run: |
          New-Item -ItemType Directory -Force desktop/test-results/windows | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          $session = (Get-Process -Id $PID).SessionId
          $facts = @{ commit=$env:GITHUB_SHA; run=$env:GITHUB_RUN_ID; os=[Environment]::OSVersion.VersionString; session=$session; interactive=[Environment]::UserInteractive; screen=[System.Windows.Forms.SystemInformation]::VirtualScreen.ToString(); image=$env:ImageVersion; node=(node --version); npm=(npm --version); python=(python --version); git=(git --version) }
          $facts | ConvertTo-Json | Set-Content desktop/test-results/windows/environment.json
          if (-not $facts.interactive -or $session -eq 0) { throw 'Runner does not expose an interactive Windows desktop' }
      - name: Install pinned build dependencies
        run: |
          python -m pip install --no-deps pip==25.3 setuptools==80.9.0 wheel==0.45.1 packaging==25.0 pytest==8.3.5 iniconfig==2.1.0 pluggy==1.6.0 colorama==0.4.6 click==8.1.8 PyYAML==6.0.2 websockets==15.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # tests/conftest.py stops the session unless graftling is installed and
          # graphtraj resolves to this checkout with its graphtraj-session command.
          python -m pip install --no-deps --no-build-isolation ./graftling
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Set-Content desktop/test-results/windows/build-packages.txt
      - name: Build desktop and check Windows native settings
        run: |
          npm --prefix desktop run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -p no:cacheprovider -q tests/test_desktop_settings.py tests/test_windows_desktop.py tests/test_desktop_activity.py::test_windows_adoption_fixture_projects_retired_content_and_usage --junitxml=desktop/test-results/windows/native-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test desktop/tests/activity.test.cjs desktop/tests/project-index.test.cjs desktop/tests/settings-draft.test.cjs desktop/tests/settings-view.test.cjs desktop/tests/settings-keyboard.test.cjs desktop/tests/usage.test.cjs desktop/tests/usage-view.test.cjs desktop/tests/usage-history.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package pinned runtime and application
        run: |
          $env:GRAPHTRAJ_BUILD_PYTHON = (Get-Command python).Source
          $env:GRAFTLING_SOURCE = Join-Path $env:GITHUB_WORKSPACE 'graftling'
          node desktop/scripts/package-win.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install archive to persistent user directory
        run: |
          $unpack = Join-Path $env:RUNNER_TEMP 'graphtraj-install-source'
          Expand-Archive desktop/test-results/package-win/GraphTraj-windows-x64.zip $unpack
          $install = Join-Path $env:LOCALAPPDATA 'Programs/GraphTraj-266'
          & "$unpack/Install-GraphTraj.ps1" -Destination $install
          # Delete the extracted source; installed launch must not need it.
          Remove-Item $unpack -Recurse -Force
          "GRAPHTRAJ_WIN_EXE=$install/GraphTraj.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Copy-Item "$install/build-manifest.json" desktop/test-results/windows/build-manifest.json
      - name: Exercise actual installed window and native dialogs
        working-directory: desktop
        run: |
          $env:GRAPHTRAJ_WIN_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'graphtraj controlled 项目'
          if ($env:GITHUB_REF_NAME -eq 'agent/290-desktop-d-direct-port-win') {
            $env:D_ADOPTION_EVIDENCE = 'test-results/windows/d'
            node tests/d-adoption.mjs
          } else { node tests/adoption-win.mjs }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain installation artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GraphTraj-windows-x64-${{ github.sha }}
          path: |
            desktop/test-results/package-win/GraphTraj-windows-x64.zip
            desktop/test-results/package-win/GraphTraj-windows-x64.zip.sha256
          if-no-files-found: warn
          retention-days: 3
      - name: Retain exact checks and native UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GraphTraj-windows-evidence-${{ github.sha }}
          path: desktop/test-results/windows/
          if-no-files-found: error
          retention-days: 3
