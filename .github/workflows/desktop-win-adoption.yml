name: Windows desktop adoption 266
on:
  push:
    branches: [agent/266-desktop-win-adoption]
permissions:
  contents: read
jobs:
  windows-adoption:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
          architecture: x64
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.7'
          architecture: x64
      - name: Confirm native desktop session
        run: |
          New-Item -ItemType Directory -Force desktop/test-results/windows | Out-Null
          Add-Type -AssemblyName System.Windows.Forms
          $session = (Get-Process -Id $PID).SessionId
          $facts = @{ commit=$env:GITHUB_SHA; run=$env:GITHUB_RUN_ID; os=[Environment]::OSVersion.VersionString; session=$session; interactive=[Environment]::UserInteractive; screen=[System.Windows.Forms.SystemInformation]::VirtualScreen.ToString(); image=$env:ImageVersion }
          $facts | ConvertTo-Json | Set-Content desktop/test-results/windows/environment.json
          if (-not $facts.interactive -or $session -eq 0) { throw 'Runner does not expose an interactive Windows desktop' }
      - name: Install pinned build dependencies
        run: |
          python -m pip install --no-deps pip==25.3 setuptools==80.9.0 wheel==0.45.1 packaging==25.0 pytest==8.3.5 iniconfig==2.1.0 pluggy==1.6.0 colorama==0.4.6 click==8.1.8 PyYAML==6.0.2 websockets==15.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip freeze | Set-Content desktop/test-results/windows/build-packages.txt
      - name: Build desktop and check Windows native settings
        run: |
          npm --prefix desktop run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -p no:cacheprovider -q tests/test_desktop_settings.py tests/test_windows_desktop.py --junitxml=desktop/test-results/windows/native-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package pinned runtime and application
        run: |
          $env:GRAPHTRAJ_BUILD_PYTHON = (Get-Command python).Source
          node desktop/scripts/package-win.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install archive to persistent user directory
        run: |
          $unpack = Join-Path $env:RUNNER_TEMP 'graphtraj-install-source'
          Expand-Archive desktop/test-results/package-win/GraphTraj-windows-x64.zip $unpack
          $install = Join-Path $env:LOCALAPPDATA 'Programs/GraphTraj-266'
          & "$unpack/Install-GraphTraj.ps1" -Destination $install
          # Delete the extracted source; installed launch must not need it.
          Remove-Item $unpack -Recurse -Force
          "GRAPHTRAJ_WIN_EXE=$install/GraphTraj.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          Copy-Item "$install/build-manifest.json" desktop/test-results/windows/build-manifest.json
      - name: Exercise actual installed window and native dialogs
        working-directory: desktop
        run: |
          $env:GRAPHTRAJ_WIN_TEST_ROOT = Join-Path $env:RUNNER_TEMP 'graphtraj controlled 项目'
          node tests/adoption-win.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain installation artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GraphTraj-windows-x64-${{ github.sha }}
          path: |
            desktop/test-results/package-win/GraphTraj-windows-x64.zip
            desktop/test-results/package-win/GraphTraj-windows-x64.zip.sha256
          if-no-files-found: warn
          retention-days: 3
      - name: Retain exact checks and native UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GraphTraj-windows-evidence-${{ github.sha }}
          path: desktop/test-results/windows/
          if-no-files-found: error
          retention-days: 3
