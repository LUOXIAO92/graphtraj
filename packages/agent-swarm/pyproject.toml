[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-swarm"
version = "0.1.0"
description = "Independent Agent control and optional native Session archives."
requires-python = ">=3.12"

[project.scripts]
agents = "agent_swarm.cli:main"
agents-mcp = "agent_swarm.mcp:main"

[tool.setuptools]
package-dir = {"" = "../../src"}

[tool.setuptools.packages.find]
where = ["../../src"]
include = ["agent_swarm*"]

[tool.setuptools.package-data]
agent_swarm = ["dsh/*.mjs", "dsh/package.json", "sessions/DSH-LICENSE"]
