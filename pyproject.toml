[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graphtraj"
version = "0.1.0"
description = "GraphTraj, a task graph and trajectory delivery harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "PyYAML>=6,<7",
    "websockets>=15,<17",
]

[project.scripts]
graphtraj = "graphtraj.interfaces.cli.graphtraj:main"
graphtraj-mcp = "graphtraj.interfaces.mcp:main"
graphtraj-tool = "graphtraj.interfaces.local_tool:main"
graphtraj-session = "graphtraj.runtimes.native_entry:main"
agent-runner = "graphtraj.interfaces.cli.agent_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphtraj = [
    "runtimes/codex/policy/*",
    "runtimes/dsh/*.mjs",
    "runtimes/pi/*.mjs",
    "prompts/*.md",
]

# Method guides are delivered data, not importable package resources and not
# Skill bodies. They install below the prefix so a wheel installation can read
# them by reference from any working directory.
[tool.setuptools.data-files]
"share/graphtraj/manuals/concept-clarification" = ["manuals/concept-clarification/guide.md"]
"share/graphtraj/manuals/research"              = ["manuals/research/guide.md"]
"share/graphtraj/manuals/setup-project"         = ["manuals/setup-project/guide.md"]
"share/graphtraj/manuals/task-breakdown"        = ["manuals/task-breakdown/guide.md"]
"share/graphtraj/manuals/task-delivery"         = ["manuals/task-delivery/guide.md"]
"share/graphtraj/manuals/task-delivery/references" = [
    "manuals/task-delivery/references/command-inputs.md",
    "manuals/task-delivery/references/recovery.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
