[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graphtraj"
version = "0.1.0"
description = "GraphTraj, a soft harness for product architecture and delivery."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "PyYAML>=6,<7",
]

[project.scripts]
graphtraj = "graphtraj.cli:main"
agent-runner = "graphtraj.agent_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphtraj = [
    "resources/codex/agents/*.toml",
    "resources/codex/hooks/*.py",
    "resources/roles/*.yml",
    "resources/skills/**/*",
]
