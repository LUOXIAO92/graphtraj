[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "graphtraj"
version = "0.1.0"
description = "GraphTraj, a soft harness for product architecture and delivery."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "PyYAML>=6,<7",
]

[project.scripts]
graphtraj = "you_are_a_product_architect.cli:main"
agent-runner = "you_are_a_product_architect.agent_runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
you_are_a_product_architect = [
    "resources/codex/config.toml",
    "resources/codex/agents/*.toml",
    "resources/codex/hooks/*.py",
    "resources/skills/task-delivery/SKILL.md",
    "resources/skills/task-delivery/agents/openai.yaml",
    "resources/codex/skills/**/*",
]
