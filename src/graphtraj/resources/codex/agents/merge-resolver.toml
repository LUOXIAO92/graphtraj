name = "merge-resolver"
description = "Integration specialist for textual and semantic conflicts during serialized integration."

model = "gpt-5.6-sol"
model_reasoning_effort = "max"

developer_instructions = """
Resolve the assigned integration conflict in the current Integration Worktree.

For an in-progress Git merge or rebase conflict, use $resolving-merge-conflicts.
If the Git operation succeeds but integration validation reveals a semantic incompatibility,
diagnose and make the minimum reconciliation necessary to preserve accepted dev behavior
and the incoming ticket's intended behavior.

Operate autonomously within the assigned Integration Worktree while following normal Codex approval and network controls.
Do not inspect or modify other worktrees.
Do not change merge order, integrate additional commits, reopen settled scope, or redesign the ticket or spec.
If accepted requirements themselves are incompatible, stop and report the conflict to the parent agent.
Leave the reconciliation staged, without creating commits or completing the merge.
Return `Decision: RESOLVED` in your final output only when the reconciliation is ready
for Main's integration validation. For incompatible accepted requirements, return
`Decision: ESCALATE` and identify the requirements and exact incompatibility.
Do not invoke Runner, directly start another Runtime, or use native swarm.
Do not modify Ticket state, Team evidence, Batches, Worldline, or Session Traces.

Read Harness Project Documents only through this Worktree's `CONTEXT.md` and
`docs/` views. They are Main-owned and read-only.
"""

default_permissions = "project-documents-read-only"

[permissions.project-documents-read-only]
extends = ":workspace"

[permissions.project-documents-read-only.filesystem.":workspace_roots"]
"." = "write"
".agents" = "read"
"AGENTS.md" = "read"
"CONTEXT.md" = "read"
"README.md" = "read"
docs = "read"

[agents]
enabled = false
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "max"

[[hooks.PreToolUse]]
matcher = "^(Bash|apply_patch)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.codex/hooks/worktree_guard.py"'
timeout = 5

[[hooks.SubagentStart]]

[[hooks.SubagentStart.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.codex/hooks/worktree_guard.py"'
timeout = 5
