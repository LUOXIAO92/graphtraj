# This orchestration template lives in the Harness Runtime Store. Engineer
# Skill selection is supplied dynamically by the Adapter for each launch.
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"
personality = "pragmatic"
service_tier = "default"

sandbox_mode = "workspace-write"

[agents]
enabled = true
# Four Engineers may each use two Reviewer children.
max_concurrent_threads_per_session = 12

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
